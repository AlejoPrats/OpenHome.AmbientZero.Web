@if (loadingService.loading()) {
<div class="background">
  <div class="container">
    <div class="indicator">
      <img style="width: 150px; height: auto; stroke-opacity: 0.4; mix-blend-mode: screen;" src="/assets/svg/loader.svg" type="image/svg+xml" />
    </div>
    <div class="matrix-container">
      <h3 class="matrix-text" data-text="Loading...">Loading...</h3>
    </div>
  </div>
</div>
}
