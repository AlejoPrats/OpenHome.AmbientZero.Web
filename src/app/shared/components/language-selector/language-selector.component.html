<tui-textfield *transloco="let t" class="tui-textfield-override" tuiChevron style="width: 100%;"
  [content]="languages && content">
  <input placeholder="{{t('languageSelector.select-a-language')}}" tuiSelect
    [(ngModel)]="value" (ngModelChange)="languageChanged()" />
  <tui-data-list-wrapper class="tui-textfield-override" *tuiDropdown
    [itemContent]="content" [items]="languages" />
</tui-textfield>


<ng-template #content let-language>
  <div *transloco="let t"
    style="display:flex; flex-direction: row; gap: 15px; align-items: center; color: var(--tui-text-primary);"
    class="card">
    <div>
      <img alt="" size="s" tuiBadge style="border-radius: 50px;" tuiSlot="bottom"
        [src]="language.countryIsoCode | tuiFlag" />
    </div>
    <div style="color: var(--tui-text-primary);">
      {{ capitalize(t(`languageSelector.${language.name}`)) }}
    </div>
  </div>
</ng-template>
