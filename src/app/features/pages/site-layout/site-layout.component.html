<header tuiNavigationHeader>
    <span tuiNavigationLogo>
        <tui-icon icon="@tui.home" />
        <span tuiFade>AmbientZero</span>
    </span>
    <hr />
    <button iconStart="@tui.bell" tuiIconButton type="button">
        Notifications
        <tui-badge-notification />
    </button>
    <button iconStart="@tui.ellipsis" tuiIconButton type="button">
        More
    </button>
    <div tuiAvatar="AI"></div>
</header>
<div *transloco="let t" [style.display]="'flex'">
    <aside style="position:fixed; height: 95vh;" [tuiNavigationAside]="expanded()">
        <header>
            <button iconStart="@tui.home" tuiAsideItem type="button">
                {{t('siteLayout.home')}}
            </button>
        </header>
        <button id="nav-temperature-chart" [routerLink]="['chart']" iconStart="@tui.chart-no-axes-column-increasing"
            tuiAsideItem type="button">
            {{t('siteLayout.temperature-chart')}}
        </button>
        <button id="nav-sensors" [routerLink]="['list']" iconStart="@tui.gauge" tuiAsideItem type="button">
            {{t('siteLayout.sensors')}}
        </button>
        <button id="nav-basic-settings" [routerLink]="['settings']" iconStart="@tui.cog" tuiAsideItem type="button">
            {{t('siteLayout.basic-settings')}}
        </button>
        <button id="nav-advanced-settings" [routerLink]="['advancedSettings']" iconStart="@tui.sliders" tuiAsideItem
            type="button">
            {{t('siteLayout.advanced-settings')}}
        </button>
        <footer>
            <button id="nav-help" iconStart="@tui.help-circle" tuiAsideItem type="button">
                {{t('siteLayout.help')}}
            </button>
            <button tuiAsideItem type="button" [iconStart]="expanded() ? '@tui.chevron-left' : '@tui.chevron-right'"
                (click)="handleToggle()">
                {{ expanded() ? 'Collapse' : 'Expand' }}
            </button>
        </footer>
    </aside>
</div>
<main *transloco="let t" style="margin-left: 40px;" tuiNavigationMain>
    <nav compact tuiSubheader [style.position]="'sticky'">
        <tui-breadcrumbs [itemsLimit]="10">
            @for (item of breadcrumbs(); track item) {
            @if ($last) {
            <strong *tuiItem>
                {{ item }}
            </strong>
            }
            @if (!$last) {
            <button *tuiItem tuiLink type="button">
                {{ item }}
            </button>
            }
            }
        </tui-breadcrumbs>
        <tui-tabs tuiFade>
            <span>{{additionalInformation()}}</span>
        </tui-tabs>
        <tui-tabs [activeItemIndex]="modes.indexOf(theme.mode())" (activeItemIndexChange)="select($event)"
            appearance="segmented">
            <button tuiTab>{{t('siteLayout.theme-light')}}</button>
            <button tuiTab>{{t('siteLayout.theme-auto')}}</button>
            <button tuiTab>{{t('siteLayout.theme-dark')}}</button>
        </tui-tabs>
    </nav>
    <router-outlet />
</main>
