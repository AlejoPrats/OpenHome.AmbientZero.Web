@if(data(); as securitySettings)
{
<div class="info-block">
    <span id="advanced-settings-system-password-section">
        <div class="title">System Passwords</div>

        <div class="row">
            <div class="label">Admin Password</div>
            <div class="value">
                <button tuiButton>
                    Change Admin Password
                </button>
            </div>
        </div>

        <div class="row">
            <div class="label">SSH Password</div>
            <div class="value" style="min-width: 500px;">
                <tui-textfield>
                    <input tuiInput type="password" [(ngModel)]="securitySettings.sshPassword" [readOnly]="true" />
                    <tui-icon tuiPassword />
                    <tui-icon tuiCopy />
                </tui-textfield>
            </div>
        </div>
    </span>
    <span id="advanced-settings-application-security-section">
        <div class="title">Application Security</div>

        <div class="row">
            <div class="label">Application Protection</div>
            <div class="value">
                <tui-textfield tuiChevron tuiDropdownMobile>
                    <input placeholder="Country" tuiComboBox [(ngModel)]="securitySettings.applicationSecurity" />
                    <tui-data-list-wrapper *tuiDropdown [items]="ApSecurityList" />
                </tui-textfield>
            </div>
        </div>
    </span>
</div>
}
<footer class="advancedSettings">
    <button tuiButton>
        Save
    </button>
</footer>
