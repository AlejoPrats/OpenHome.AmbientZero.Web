<tui-textfield class="search-text-field" iconStart="@tui.search" tuiTextfieldSize="m">
    <input aria-label="Search help topics" placeholder="Search help topics" tuiInput type="text" [ngModel]="searchText()"
        (ngModelChange)="searchText.set($event)" />
</tui-textfield>
<tui-tree [childrenHandler]="handler" [map]="map" [content]="content" [tuiTreeController]="isSearching()" [value]="data()" />
<ng-template #content let-item>
    <span class="tree-node-container" (click)="nodeClick(item)">
        <app-icon size="small" [name]="item.icon ? item.icon : defaultIcon" />
        {{ item.text }}
        @if(item.children)
        {
        <app-icon class="expand_collapse_icon" size="small" [name]="(map.get(item) ?? isSearching()) ? expandedIcon() : collapsedIcon()" />
        }
        @if(item.hasTour)
        {
        <button tuiButton class="tour-button" iconStart="@tui.bus" size="xs" (click)="onActionClick($event,item)"
            tuiHint="Take Tour"></button>
        }
    </span>
</ng-template>
